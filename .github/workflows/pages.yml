name: Refresh city and deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'
permissions:
  contents: read
concurrency:
  group: codecity-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Read public GitHub data
        run: npm run sync
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_USER: ${{ vars.CODECITY_USER || github.repository_owner }}
      - uses: actions/configure-pages@v5
        id: pages
      - name: Generate public preview and profile
        run: npm run preview:svg
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}/
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
